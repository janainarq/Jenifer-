<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jenifer Arquitetura</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#faf9f7;color:#111;padding:24px}nav{display:flex;justify-content:space-between;max-width:1100px;margin:0 auto 40px;font-weight:700} .hero{max-width:1100px;margin:0 auto 50px}.hero h1{font-size:42px}.btn{background:#111;color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;display:inline-block;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1100px;margin:0 auto}.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:18px}</style></head><body><nav><span id="logo">JENIFER</span><a id="zap" href="#">WhatsApp</a></nav><div class="hero"><h1 id="nome"></h1><p id="sub"></p><a id="cta" class="btn" href="#">Agendar</a></div><div class="grid" id="grid"></div><script src="config.js"></script><script>document.getElementById('nome').innerText=CFG.nome;document.getElementById('logo').innerText=CFG.curto;document.getElementById('sub').innerText=CFG.sub;let z='https://wa.me/'+CFG.whatsapp;document.getElementById('zap').href=z;document.getElementById('cta').href=z;let g=document.getElementById('grid');CFG.projetos.forEach(p=>{g.innerHTML+=`<div class="card"><small>${p.c}</small><h3>${p.t}</h3><p>${p.d}</p></div>`});</script></body></html>
